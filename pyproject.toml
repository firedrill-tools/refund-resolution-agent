[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refund-resolution-agent"
version = "0.1.0"
description = "Pydantic AI refund resolution with explicit approval and payment state"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[anthropic]==2.56.0"]

[project.scripts]
resolve-refund = "refund_resolution.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/refund_resolution"]

[tool.pytest.ini_options]
testpaths = ["tests"]
