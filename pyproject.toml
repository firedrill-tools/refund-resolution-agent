[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refund-resolution-agent"
version = "0.2.0"
description = "Pydantic AI refund resolution with explicit approval and payment state"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic-ai-slim[anthropic]==2.56.0", "anthropic==1.14.0", "httpx2==2.13.1"]

[project.scripts]
resolve-refund = "refund_resolution.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/refund_resolution"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "refund_resolution/sample_data"

[tool.hatch.build.targets.sdist]
include = ["firedrill", ".github", ".gitignore", "src", "data", "fixtures", "tests", "scripts", "scenarios", "README.md", "AGENTS.md", "PLAN.md", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
